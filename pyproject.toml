[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]   # S = security rules (flake8-bandit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "evals"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
